<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML Audio and Video Lab</title>
</head>
<body>
  <h1>Test HTML video-audio</h1>
  <section>
    <h2>Journey-Lights (1978), Video</h2>
    <video controls width="640" src="https://raw.githubusercontent.com/ChaBls/Video_Hosting/main/Journey-Lights.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture vidéo.
    </video>
  </section>
  <section>
    <h2>Journey-Lights (1978), Audio</h2>
    <audio controls loop src="https://raw.githubusercontent.com/ChaBls/Video_Hosting/main/Journey-Lights.mp3" type="audio/mpeg">
			Votre navigateur ne supporte pas la lecture audio.
    </audio>
  </section>
</body>
</html>
